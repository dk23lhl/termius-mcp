name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    # The adapter targets macOS Termius. These suites need no Termius, debug port,
    # credentials or remote host.
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python that pyproject.toml allows, and the one used for validation.
        python-version: ["3.11", "3.12"]
    steps:
      # Pinned to commits: a tag can be moved after review.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Python suite
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pytest tests -q

      - name: JavaScript suite
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Build, install outside the checkout, discover tools
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/dist"
          wheel=$(ls "$RUNNER_TEMP"/dist/termius_mcp-*.whl)
          python - "$wheel" <<'EOF'
          import sys, zipfile
          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          need = {f"termius_mcp/{f}" for f in ("server.py", "bridge.js", "native.js")}
          sys.exit(f"wheel lacks {sorted(need - names)}" if need - names else 0)
          EOF
          python -m venv "$RUNNER_TEMP/pkg"
          "$RUNNER_TEMP/pkg/bin/python" -m pip install -r requirements.lock "$wheel"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pkg/bin/python" "$GITHUB_WORKSPACE/tests/smoke_mcp_stdio.py" "$RUNNER_TEMP/pkg/bin/termius-mcp"
